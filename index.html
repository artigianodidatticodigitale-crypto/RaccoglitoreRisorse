    <script>
        // QR Code Generator - Functional implementation
        function generateQRCode(text, size = 200) {
            // Use QR Server API to generate real QR codes
            const encodedText = encodeURIComponent(text);
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodedText}&format=svg&margin=10`;
            
            // Create SVG that embeds the QR code as an image
            return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
                <rect width="${size}" height="${size}" fill="white"/>
                <image href="${qrUrl}" x="0" y="0" width="${size}" height="${size}"/>
            </svg>`;
        }

        // Create resource card
        function createResourceCard(title, description, url) {
            const qrCode = generateQRCode(url, 120);
            
            const card = document.createElement('div');
            card.className = 'resource-card bg-gray-50 rounded-xl p-6 border border-gray-200 cursor-pointer hover:shadow-lg transition-all';
            
            card.innerHTML = `
                <div class="mb-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-2 editable" contenteditable="true">${title}</h3>
                    <p class="text-gray-600 text-sm editable" contenteditable="true">${description}</p>
                </div>
                
                <div class="flex items-center justify-center mb-4">
                    <div class="qr-code border-2 border-gray-300 rounded-lg p-2 bg-white">
                        ${qrCode}
                    </div>
                </div>
                
                <div class="flex gap-2">
                    <button class="open-link-btn flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium" data-url="${url}">
                        <svg class="inline-block w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                        Apri
                    </button>
                    <button class="copy-link-btn bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors text-sm font-medium" data-url="${url}">
                        <svg class="inline-block w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                    <button class="delete-resource-btn bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 transition-colors text-sm font-medium" style="display: none;">
                        <svg class="inline-block w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            `;
            
            // Add click to expand functionality
            card.addEventListener('click', (e) => {
                if (!e.target.closest('button') && !e.target.closest('.editable')) {
                    expandCard(card);
                }
            });
            
            return card;
        }

        // Expand card to fullscreen
        function expandCard(card) {
            const modal = document.createElement('div');
            modal.className = 'fullscreen-modal';
            
            const cardClone = card.cloneNode(true);
            cardClone.className = 'bg-white rounded-2xl p-12 max-w-2xl w-full mx-4 shadow-2xl transform scale-110';
            
            const closeBtn = document.createElement('button');
            closeBtn.className = 'absolute top-8 right-8 text-white hover:text-gray-300 transition-colors';
            closeBtn.innerHTML = `
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            `;
            
            closeBtn.addEventListener('click', () => {
                document.body.removeChild(modal);
            });
            
            modal.appendChild(closeBtn);
            modal.appendChild(cardClone);
            document.body.appendChild(modal);
            
            // Close on background click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                }
            });
        }

        // Create new section
        function createSection(title, description) {
            const section = document.createElement('div');
            section.className = 'section bg-white rounded-2xl shadow-lg p-8';
            
            section.innerHTML = `
                <div class="mb-6 relative">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h2 class="text-2xl font-semibold text-gray-800 mb-3 editable" contenteditable="true">${title}</h2>
                            <p class="text-gray-600 text-lg editable" contenteditable="true">${description}</p>
                        </div>
                        <button class="delete-section-btn bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors text-sm font-medium ml-4" style="display: none;">
                            <svg class="inline-block w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            Elimina Sezione
                        </button>
                    </div>
                </div>
                
                <div class="resources-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                </div>
                
                <button class="add-resource-btn w-full py-4 border-2 border-dashed border-blue-300 text-blue-600 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all font-medium text-lg">
                    <svg class="inline-block w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                    Aggiungi Risorsa
                </button>
            `;
            
            return section;
        }

        // Copy functionality helpers
        function showCopySuccess(btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<svg class="inline-block w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            btn.classList.remove('bg-gray-600', 'hover:bg-gray-700');
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-gray-600', 'hover:bg-gray-700');
            }, 2000);
        }
        
        function fallbackCopyText(text, btn) {
            // Create temporary textarea for copying
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showCopySuccess(btn);
            } catch (err) {
                console.error('Fallback copy failed:', err);
                // Show error feedback
                const originalText = btn.innerHTML;
                btn.innerHTML = '❌';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }
            
            document.body.removeChild(textArea);
        }

        // Password protection system
        let isEditMode = false;
        let currentSection = null;
        
        // Password management functions
        const FIXED_PASSWORD = "Artigi@no88";
        
        function checkPassword(password) {
            return password === FIXED_PASSWORD;
        }
        
        function enableEditMode() {
            isEditMode = true;
            
            // Show success bar, hide password bar
            document.getElementById('passwordBar').classList.add('hidden');
            document.getElementById('successBar').classList.remove('hidden');
            
            // Enable all edit functionality
            document.querySelectorAll('.editable').forEach(el => {
                el.contentEditable = true;
                el.style.pointerEvents = 'auto';
            });
            
            // Show edit buttons
            document.querySelectorAll('.add-resource-btn, #addSectionBtn, #saveBtn').forEach(btn => {
                btn.style.display = 'block';
                btn.disabled = false;
            });
            
            // Show delete buttons - force visibility
            document.querySelectorAll('.delete-resource-btn').forEach(btn => {
                btn.style.display = 'inline-block';
                btn.style.visibility = 'visible';
                btn.disabled = false;
            });
            
            document.querySelectorAll('.delete-section-btn').forEach(btn => {
                btn.style.display = 'inline-block';
                btn.style.visibility = 'visible';
                btn.disabled = false;
            });
        }
        
        function disableEditMode() {
            isEditMode = false;
            
            // Show password bar, hide success bar
            document.getElementById('passwordBar').classList.remove('hidden');
            document.getElementById('successBar').classList.add('hidden');
            
            // Disable all edit functionality
            document.querySelectorAll('.editable').forEach(el => {
                el.contentEditable = false;
                el.style.pointerEvents = 'none';
            });
            
            // Hide edit buttons
            document.querySelectorAll('.add-resource-btn, #addSectionBtn, #saveBtn').forEach(btn => {
                btn.style.display = 'none';
                btn.disabled = true;
            });
            
            // Hide delete buttons - force hiding
            document.querySelectorAll('.delete-resource-btn').forEach(btn => {
                btn.style.display = 'none';
                btn.style.visibility = 'hidden';
                btn.disabled = true;
            });
            
            document.querySelectorAll('.delete-section-btn').forEach(btn => {
                btn.style.display = 'none';
                btn.style.visibility = 'hidden';
                btn.disabled = true;
            });
            
            // Clear password input
            document.getElementById('passwordInput').value = '';
        }
        

        
        // Unlock button handler
        document.getElementById('unlockBtn').addEventListener('click', () => {
            const password = document.getElementById('passwordInput').value;
            
            if (checkPassword(password)) {
                enableEditMode();
            } else {
                // Show error feedback
                const input = document.getElementById('passwordInput');
                input.classList.add('border-red-500');
                input.placeholder = 'Password errata!';
                input.value = '';
                
                setTimeout(() => {
                    input.classList.remove('border-red-500');
                    input.placeholder = 'Password...';
                }, 2000);
            }
        });
        
        // Lock button handler
        document.getElementById('lockBtn').addEventListener('click', () => {
            disableEditMode();
        });
        
        // Enter key support for password input
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('unlockBtn').click();
            }
        });

        // Event listeners

        // Add resource modal handlers
        document.addEventListener('click', (e) => {
            // Prevent event bubbling for delete buttons
            if (e.target.closest('.delete-resource-btn')) {
                e.preventDefault();
                e.stopPropagation();
                
                if (!isEditMode) return;
                
                const resourceCard = e.target.closest('.resource-card');
                const resourceTitle = resourceCard.querySelector('h3').textContent;
                
                if (confirm(`Sei sicuro di voler eliminare la risorsa "${resourceTitle}"?`)) {
                    resourceCard.remove();
                    scheduleAutoSave();
                }
                return;
            }
            
            if (e.target.closest('.delete-section-btn')) {
                e.preventDefault();
                e.stopPropagation();
                
                if (!isEditMode) return;
                
                const section = e.target.closest('.section');
                const sectionTitle = section.querySelector('h2').textContent;
                const sectionsCount = document.querySelectorAll('.section').length;
                
                // Prevent deleting the last section
                if (sectionsCount <= 1) {
                    alert('Non puoi eliminare l\'ultima sezione rimasta!');
                    return;
                }
                
                if (confirm(`Sei sicuro di voler eliminare la sezione "${sectionTitle}" e tutte le sue risorse?`)) {
                    section.remove();
                    scheduleAutoSave();
                }
                return;
            }
            
            if (e.target.closest('.add-resource-btn')) {
                if (!isEditMode) return;
                currentSection = e.target.closest('.section');
                document.getElementById('addResourceModal').classList.remove('hidden');
                document.getElementById('addResourceModal').classList.add('flex');
            }
            
            if (e.target.closest('.open-link-btn')) {
                const url = e.target.closest('.open-link-btn').dataset.url;
                window.open(url, '_blank');
            }
            
            if (e.target.closest('.copy-link-btn')) {
                const url = e.target.closest('.copy-link-btn').dataset.url;
                
                // Try modern clipboard API first, fallback to older method
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => {
                        showCopySuccess(e.target.closest('.copy-link-btn'));
                    }).catch(() => {
                        fallbackCopyText(url, e.target.closest('.copy-link-btn'));
                    });
                } else {
                    fallbackCopyText(url, e.target.closest('.copy-link-btn'));
                }
            }
        });

        // Modal close handlers
        document.getElementById('cancelResourceBtn').addEventListener('click', () => {
            document.getElementById('addResourceModal').classList.add('hidden');
            document.getElementById('addResourceModal').classList.remove('flex');
            document.getElementById('resourceTitle').value = '';
            document.getElementById('resourceDescription').value = '';
            document.getElementById('resourceUrl').value = '';
        });

        document.getElementById('confirmResourceBtn').addEventListener('click', () => {
            const title = document.getElementById('resourceTitle').value.trim();
            const description = document.getElementById('resourceDescription').value.trim();
            let url = document.getElementById('resourceUrl').value.trim();
            
            if (title && url) {
                // Normalize URL - add https:// if missing protocol
                if (!url.match(/^https?:\/\//)) {
                    url = 'https://' + url;
                }
                
                const resourceCard = createResourceCard(title, description || 'Nessuna descrizione', url);
                const grid = currentSection.querySelector('.resources-grid');
                grid.appendChild(resourceCard);
                
                // Show delete button if in edit mode
                if (isEditMode) {
                    const deleteBtn = resourceCard.querySelector('.delete-resource-btn');
                    if (deleteBtn) {
                        deleteBtn.style.display = 'inline-block';
                        deleteBtn.style.visibility = 'visible';
                    }
                }
                
                document.getElementById('addResourceModal').classList.add('hidden');
                document.getElementById('addResourceModal').classList.remove('flex');
                document.getElementById('resourceTitle').value = '';
                document.getElementById('resourceDescription').value = '';
                document.getElementById('resourceUrl').value = '';
                
                // Auto-save after adding resource
                scheduleAutoSave();
            }
        });

        // Add section handlers
        document.getElementById('addSectionBtn').addEventListener('click', () => {
            if (!isEditMode) return;
            document.getElementById('addSectionModal').classList.remove('hidden');
            document.getElementById('addSectionModal').classList.add('flex');
        });

        document.getElementById('cancelSectionBtn').addEventListener('click', () => {
            document.getElementById('addSectionModal').classList.add('hidden');
            document.getElementById('addSectionModal').classList.remove('flex');
            document.getElementById('sectionTitle').value = '';
            document.getElementById('sectionDescription').value = '';
        });

        document.getElementById('confirmSectionBtn').addEventListener('click', () => {
            const title = document.getElementById('sectionTitle').value.trim();
            const description = document.getElementById('sectionDescription').value.trim();
            
            if (title) {
                const newSection = createSection(title, description || 'Nessuna descrizione');
                document.getElementById('sectionsContainer').appendChild(newSection);
                
                // Show delete button if in edit mode
                if (isEditMode) {
                    const deleteBtn = newSection.querySelector('.delete-section-btn');
                    if (deleteBtn) {
                        deleteBtn.style.display = 'inline-block';
                        deleteBtn.style.visibility = 'visible';
                    }
                }
                
                document.getElementById('addSectionModal').classList.add('hidden');
                document.getElementById('addSectionModal').classList.remove('flex');
                document.getElementById('sectionTitle').value = '';
                document.getElementById('sectionDescription').value = '';
                
                // Auto-save after adding section
                scheduleAutoSave();
            }
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const resourceCards = document.querySelectorAll('.resource-card');
            
            resourceCards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                const description = card.querySelector('p').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = searchTerm ? 'none' : 'block';
                }
            });
        });

        // Enhanced save functionality for Canva environment
        function saveDashboardData() {
            const dashboardData = {
                title: document.querySelector('header h1').textContent,
                sections: [],
                timestamp: new Date().toISOString()
            };
            
            document.querySelectorAll('.section').forEach(section => {
                const sectionData = {
                    title: section.querySelector('h2').textContent,
                    description: section.querySelector('p').textContent,
                    resources: []
                };
                
                section.querySelectorAll('.resource-card').forEach(card => {
                    const resourceData = {
                        title: card.querySelector('h3').textContent,
                        description: card.querySelector('p').textContent,
                        url: card.querySelector('.open-link-btn').dataset.url
                    };
                    sectionData.resources.push(resourceData);
                });
                
                dashboardData.sections.push(sectionData);
            });
            
            // Multiple storage methods for maximum compatibility
            try {
                // Primary storage method
                localStorage.setItem('canva_dashboard_data', JSON.stringify(dashboardData));
                
                // Backup storage in sessionStorage
                sessionStorage.setItem('canva_dashboard_backup', JSON.stringify(dashboardData));
                
                // Store in a hidden element as additional backup
                let hiddenStorage = document.getElementById('hiddenDataStorage');
                if (!hiddenStorage) {
                    hiddenStorage = document.createElement('div');
                    hiddenStorage.id = 'hiddenDataStorage';
                    hiddenStorage.style.display = 'none';
                    document.body.appendChild(hiddenStorage);
                }
                hiddenStorage.textContent = JSON.stringify(dashboardData);
                
                return true;
            } catch (error) {
                console.error('Save failed:', error);
                return false;
            }
        }
        
        // Auto-save functionality
        function autoSave() {
            saveDashboardData();
        }
        
        // Save button handler
        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!isEditMode) return;
            const success = saveDashboardData();
            
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            
            if (success) {
                btn.innerHTML = `
                    <svg class="inline-block w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Salvato!
                `;
                btn.classList.add('from-green-500', 'to-green-600');
                btn.classList.remove('from-purple-500', 'to-purple-600');
            } else {
                btn.innerHTML = `
                    <svg class="inline-block w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                    Errore!
                `;
                btn.classList.add('from-red-500', 'to-red-600');
                btn.classList.remove('from-purple-500', 'to-purple-600');
            }
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('from-green-500', 'to-green-600', 'from-red-500', 'to-red-600');
                btn.classList.add('from-purple-500', 'to-purple-600');
            }, 3000);
        });
        
        // Auto-save on changes
        let autoSaveTimeout;
        function scheduleAutoSave() {
            if (!isEditMode) return;
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(autoSave, 2000); // Auto-save after 2 seconds of inactivity
        }

        // Enhanced load functionality for Canva environment
        function loadDashboardData() {
            let savedData = null;
            
            // Try multiple storage sources
            try {
                // Try primary storage
                savedData = localStorage.getItem('canva_dashboard_data');
                
                // Fallback to backup storage
                if (!savedData) {
                    savedData = sessionStorage.getItem('canva_dashboard_backup');
                }
                
                // Fallback to hidden element storage
                if (!savedData) {
                    const hiddenStorage = document.getElementById('hiddenDataStorage');
                    if (hiddenStorage) {
                        savedData = hiddenStorage.textContent;
                    }
                }
                
                if (savedData) {
                    const data = JSON.parse(savedData);
                    
                    // Update title
                    document.querySelector('header h1').textContent = data.title;
                    
                    // Clear existing sections except the first one
                    const container = document.getElementById('sectionsContainer');
                    const firstSection = container.querySelector('.section');
                    
                    // Update first section
                    if (data.sections.length > 0) {
                        const firstSectionData = data.sections[0];
                        firstSection.querySelector('h2').textContent = firstSectionData.title;
                        firstSection.querySelector('p').textContent = firstSectionData.description;
                        
                        const grid = firstSection.querySelector('.resources-grid');
                        grid.innerHTML = '';
                        
                        firstSectionData.resources.forEach(resource => {
                            const card = createResourceCard(resource.title, resource.description, resource.url);
                            grid.appendChild(card);
                        });
                    }
                    
                    // Add additional sections
                    for (let i = 1; i < data.sections.length; i++) {
                        const sectionData = data.sections[i];
                        const section = createSection(sectionData.title, sectionData.description);
                        
                        const grid = section.querySelector('.resources-grid');
                        sectionData.resources.forEach(resource => {
                            const card = createResourceCard(resource.title, resource.description, resource.url);
                            grid.appendChild(card);
                        });
                        
                        container.appendChild(section);
                        
                        // Ensure delete buttons are properly hidden initially
                        const deleteBtn = section.querySelector('.delete-section-btn');
                        if (deleteBtn) {
                            deleteBtn.style.display = 'none';
                            deleteBtn.style.visibility = 'hidden';
                        }
                        
                        // Hide delete buttons on resources too
                        section.querySelectorAll('.delete-resource-btn').forEach(btn => {
                            btn.style.display = 'none';
                            btn.style.visibility = 'hidden';
                        });
                    }
                    
                    return true;
                }
            } catch (error) {
                console.error('Load failed:', error);
            }
            
            return false;
        }
        
        // Initialize application
        window.addEventListener('load', () => {
            // Start in locked mode
            disableEditMode();
            
            // Try to load saved data
            const loaded = loadDashboardData();
            
            if (!loaded) {
                // If no saved data, ensure clean initial state
                const container = document.getElementById('sectionsContainer');
                const firstSection = container.querySelector('.section');
                
                // Clear the resources grid in the first section
                const grid = firstSection.querySelector('.resources-grid');
                grid.innerHTML = '';
                
                // Remove any additional sections beyond the first one
                const sections = container.querySelectorAll('.section');
                for (let i = 1; i < sections.length; i++) {
                    sections[i].remove();
                }
            }
            
            // Set up auto-save listeners for editable content
            document.addEventListener('input', (e) => {
                if (e.target.classList.contains('editable') && isEditMode) {
                    scheduleAutoSave();
                }
            });
            
            // Auto-save on blur for editable elements
            document.addEventListener('blur', (e) => {
                if (e.target.classList.contains('editable') && isEditMode) {
                    scheduleAutoSave();
                }
            }, true);
        });
    </script>
